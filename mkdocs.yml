site_name: Frappe Framework
site_description: Technical documentation of Frappe Framework v15 for app developers, desk users and AI agents
site_url: https://www.dptnl.sh/frappe/
repo_url: https://github.com/diptanilsaha/frappe
repo_name: diptanilsaha/frappe
edit_uri: edit/version-15-hotfix/docs/
docs_dir: docs
extra:
  version:
    provider: mike
    default: stable
theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy
  palette:
    - scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
validation:
  links:
    not_found: warn
    anchors: warn
nav:
  - Home: index.md
  - What's New: changes.md
  - For AI Agents: AGENTS.md
  - Getting Started:
      - getting-started/index.md
